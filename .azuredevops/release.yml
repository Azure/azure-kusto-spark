trigger:
  branches:
    exclude:
      - '*'
  tags:
    include:
      - 'v3.0_*'
      - 'v4.0_*'

pr: none

parameters:
- name: sourceTag
  displayName: Tag to release when manually queued
  type: string
  default: ''
- name: uploadToAzure
  displayName: Upload artifacts to Azure Storage
  type: boolean
  default: false
- name: createGitHubRelease
  displayName: Create the GitHub release
  type: boolean
  default: false

pool:
  vmImage: ubuntu-latest

jobs:
- job: Release
  displayName: Verify and stage release
  timeoutInMinutes: 60
  steps:
  - checkout: self
    clean: true
    fetchDepth: 0

  - bash: |
      set -euo pipefail

      source_ref="$(Build.SourceBranch)"
      if [[ -n "${SOURCE_TAG}" ]]; then
        source_ref="${SOURCE_TAG}"
        if [[ "${source_ref}" != refs/tags/* ]]; then
          source_ref="refs/tags/${source_ref}"
        fi
      elif [[ "${source_ref}" != refs/tags/* ]]; then
        echo "The sourceTag parameter is required for a manual release run." >&2
        exit 1
      fi

      git fetch --force origin "${source_ref}"
      git checkout --detach FETCH_HEAD

      release_tag="${source_ref#refs/tags/}"
      release_commit="$(git rev-parse HEAD)"
      echo "##vso[task.setvariable variable=RELEASE_TAG]${release_tag}"
      echo "##vso[task.setvariable variable=RELEASE_COMMIT]${release_commit}"
    displayName: Check out release tag
    env:
      SOURCE_TAG: ${{ parameters.sourceTag }}

  - task: JavaToolInstaller@0
    displayName: Use Java 21
    inputs:
      versionSpec: '21'
      jdkArchitectureOption: x64
      jdkSourceOption: PreInstalled

  - task: Cache@2
    displayName: Cache Maven dependencies
    inputs:
      key: 'maven | "$(Agent.OS)" | **/pom.xml'
      restoreKeys: |
        maven | "$(Agent.OS)"
        maven
      path: $(Pipeline.Workspace)/.m2/repository

  - task: AzureCLI@2
    displayName: Verify release
    inputs:
      azureSubscription: $(AZURE_SERVICE_CONNECTION)
      addSpnToEnvironment: true
      scriptType: bash
      scriptLocation: inlineScript
      workingDirectory: $(Build.SourcesDirectory)
      inlineScript: |
        set -euo pipefail

        access_token="$(
          az account get-access-token \
            --resource "$(KUSTO_CLUSTER)" \
            --query accessToken \
            --output tsv
        )"
        echo "##vso[task.setsecret]${access_token}"

        export kustoAadAppId="${servicePrincipalId}"
        export kustoAadAuthorityID="${tenantId}"
        export kustoDatabase="$(KUSTO_DATABASE)"
        export kustoCluster="$(KUSTO_CLUSTER)"
        export accessToken="${access_token}"
        export storageAccountUrl="$(STORAGE_CONTAINER_URL)"

        mvn clean verify -B \
          -DkustoAadAppId="${kustoAadAppId}" \
          -DkustoAadAuthorityID="${kustoAadAuthorityID}" \
          -DkustoDatabase="${kustoDatabase}" \
          -DkustoCluster="${kustoCluster}" \
          -DaccessToken="${accessToken}"
    env:
      MAVEN_OPTS: -Dmaven.repo.local=$(Pipeline.Workspace)/.m2/repository

  - bash: |
      set -euo pipefail

      version="$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)"
      scala_version="$(mvn help:evaluate -Dexpression=scala.version.major -q -DforceStdout)"
      spark_version="$(mvn help:evaluate -Dexpression=spark.version.major -q -DforceStdout)"

      mkdir -p staging
      cp connector/target/*.jar staging/
      cp connector/.flattened-pom.xml \
        "staging/kusto-spark_${spark_version}_${scala_version}-${version}.pom"

      echo "##vso[task.setvariable variable=PROJECT_VERSION]${version}"
      echo "##vso[task.setvariable variable=SCALA_VERSION]${scala_version}"
      echo "##vso[task.setvariable variable=SPARK_VERSION]${spark_version}"
    displayName: Stage release artifacts

  - task: PublishPipelineArtifact@1
    displayName: Publish staged artifacts
    inputs:
      targetPath: $(Build.SourcesDirectory)/staging
      artifact: release

  - task: PublishTestResults@2
    displayName: Publish test results
    condition: always()
    inputs:
      testResultsFormat: JUnit
      testResultsFiles: '**/surefire-reports/*.xml'
      searchFolder: $(Build.SourcesDirectory)
      testRunTitle: azure-kusto-spark release
      failTaskOnMissingResultsFile: true

  - task: GitHubRelease@1
    displayName: Create GitHub release
    condition: and(succeeded(), or(startsWith(variables['Build.SourceBranch'], 'refs/tags/'), ${{ eq(parameters.createGitHubRelease, true) }}))
    inputs:
      gitHubConnection: $(GITHUB_SERVICE_CONNECTION)
      repositoryName: Azure/azure-kusto-spark
      action: create
      target: $(RELEASE_COMMIT)
      tagSource: userSpecifiedTag
      tag: $(RELEASE_TAG)
      title: $(RELEASE_TAG)
      releaseNotesFilePath: $(Build.SourcesDirectory)/CHANGELOG.md
      assets: |
        $(Build.SourcesDirectory)/staging/*.jar
        $(Build.SourcesDirectory)/staging/*.pom
      addChangeLog: false

  - task: AzureCLI@2
    displayName: Upload artifacts to Azure Storage
    condition: and(succeeded(), or(startsWith(variables['Build.SourceBranch'], 'refs/tags/'), ${{ eq(parameters.uploadToAzure, true) }}))
    inputs:
      azureSubscription: $(AZURE_RELEASE_SERVICE_CONNECTION)
      scriptType: bash
      scriptLocation: inlineScript
      workingDirectory: $(Build.SourcesDirectory)
      inlineScript: |
        set -euo pipefail

        az storage blob upload-batch \
          --account-name "$(AZURE_RELEASE_STORAGE_ACCOUNT)" \
          --destination "$(AZURE_STORAGE_CONTAINER)/kusto/spark/$(SPARK_VERSION)_$(PROJECT_VERSION)" \
          --source staging \
          --auth-mode login \
          --overwrite
