# Each entry produces a Build/Test job pair. spark3 selects the release/spark3
# (true) or master (false) jobs. mavenArgs is added to every Maven command.
# The SparkNN entries compile and test master against newer Spark releases,
# so changes that break Spark 4.1/4.2 are caught on the PR. The published jar
# is still built against Spark 4.0 by the Java entries. Netty and the Scala
# patch level are set to the Spark release's own versions; the shaded jar
# keeps the default Netty.
parameters:
- name: buildConfigs
  type: object
  default:
  - id: Java8
    displayName: Java 8
    java: '8'
    spark3: 'true'
    mavenArgs: ''
  - id: Java11
    displayName: Java 11
    java: '11'
    spark3: 'true'
    mavenArgs: ''
  - id: Java17
    displayName: Java 17
    java: '17'
    spark3: 'false'
    mavenArgs: ''
  - id: Java21
    displayName: Java 21
    java: '21'
    spark3: 'false'
    mavenArgs: ''
  - id: Spark41Java17
    displayName: Spark 4.1.4 - Java 17
    java: '17'
    spark3: 'false'
    mavenArgs: -Dspark.version.major=4.1 -Dspark.version.minor=4 -Dscala.version.minor=17 -Dnetty.version=4.2.7.Final
  - id: Spark42Java17
    displayName: Spark 4.2.1 - Java 17
    java: '17'
    spark3: 'false'
    mavenArgs: -Dspark.version.major=4.2 -Dspark.version.minor=1 -Dscala.version.minor=18 -Dnetty.version=4.2.13.Final

trigger:
  branches:
    include:
      - '*'

pr:
  branches:
    include:
      - '*'

pool:
  vmImage: ubuntu-latest

variables:
# To validate Spark 3, create a feature branch from release/spark3, copy this
# YAML into it, commit and push, then open a PR targeting release/spark3.
# PR validation builds the proposed changes with Java 8/11 in separate
# build/test jobs. Push or manual runs on a feature branch use the master
# jobs (Java 17/21 and Spark 4.1/4.2);
# only the exact release/spark3 branch selects Java 8/11 without a PR.
# Selection uses branch names/PR targets, not branch ancestry or the POM.
# Generate all job pairs; runtime conditions select the matching versions
# because the PR target is unavailable during template expansion.
- name: isSpark3
  value: $[or(eq(variables['System.PullRequest.TargetBranch'], 'refs/heads/release/spark3'), eq(variables['System.PullRequest.TargetBranch'], 'release/spark3'), and(ne(variables['Build.Reason'], 'PullRequest'), eq(variables['Build.SourceBranch'], 'refs/heads/release/spark3')))]

jobs:
- ${{ each config in parameters.buildConfigs }}:
  - job: Build${{ config.id }}
    displayName: Build - ${{ config.displayName }}
    timeoutInMinutes: 40
    ${{ if eq(config.spark3, 'true') }}:
      condition: and(succeeded(), eq(variables['isSpark3'], 'True'))
    ${{ else }}:
      condition: and(succeeded(), eq(variables['isSpark3'], 'False'))
    steps:
    - checkout: self
      clean: true
      persistCredentials: false

    - ${{ if eq(config.java, '8') }}:
      - bash: |
          set -euo pipefail

          archive="$(Agent.TempDirectory)/temurin8.tar.gz"
          curl --fail --location --retry 3 \
            --output "${archive}" \
            https://github.com/adoptium/temurin8-binaries/releases/download/jdk8u512-b09/OpenJDK8U-jdk_x64_linux_hotspot_8u512b09.tar.gz
          printf '%s  %s\n' \
            fb3bfa869012419b562bb4235d0d83ec4f8c1dda62ae432ba20c6c3a7e43f7e4 \
            "${archive}" | sha256sum --check
        displayName: Download and verify Temurin Java 8

    - task: JavaToolInstaller@0
      displayName: Use Java ${{ config.java }}
      inputs:
        versionSpec: '${{ config.java }}'
        jdkArchitectureOption: x64
        ${{ if eq(config.java, '8') }}:
          jdkSourceOption: LocalDirectory
          jdkFile: $(Agent.TempDirectory)/temurin8.tar.gz
          jdkDestinationDirectory: $(Agent.TempDirectory)/temurin8
        ${{ else }}:
          jdkSourceOption: PreInstalled

    - task: Cache@2
      displayName: Cache Maven dependencies
      inputs:
        key: 'maven | "$(Agent.OS)" | "${{ config.id }}" | pom.xml | connector/pom.xml | samples/pom.xml'
        restoreKeys: |
          maven | "$(Agent.OS)" | "${{ config.id }}"
          maven | "$(Agent.OS)"
        path: $(Pipeline.Workspace)/.m2/repository

    - bash: |
        set -euo pipefail

        mvn clean verify -B -ntp -DskipTests ${{ config.mavenArgs }}
      displayName: Compile and package without running tests
      env:
        MAVEN_OPTS: -Dmaven.repo.local=$(Pipeline.Workspace)/.m2/repository

    - bash: |
        set -euo pipefail

        git rev-parse HEAD > "$(Build.ArtifactStagingDirectory)/source-commit.txt"
        git archive --format=tar \
          --output="$(Build.ArtifactStagingDirectory)/build.tar" HEAD
        tar --append --file="$(Build.ArtifactStagingDirectory)/build.tar" \
          connector/target samples/target
        gzip "$(Build.ArtifactStagingDirectory)/build.tar"
      displayName: Bundle source and compiled build outputs

    - task: PublishPipelineArtifact@1
      displayName: Publish ${{ config.displayName }} build
      inputs:
        targetPath: $(Build.ArtifactStagingDirectory)
        artifact: build-${{ config.id }}

  - job: Test${{ config.id }}
    displayName: Test - ${{ config.displayName }}
    dependsOn: Build${{ config.id }}
    timeoutInMinutes: 40
    condition: and(succeeded(), eq(dependencies.Build${{ config.id }}.result, 'Succeeded'), or(ne(variables['Build.Reason'], 'PullRequest'), eq(variables['System.PullRequest.IsFork'], 'False')))
    variables:
    - group: azure-kusto-spark-e2e
    steps:
    - checkout: none

    - ${{ if eq(config.java, '8') }}:
      - bash: |
          set -euo pipefail

          archive="$(Agent.TempDirectory)/temurin8.tar.gz"
          curl --fail --location --retry 3 \
            --output "${archive}" \
            https://github.com/adoptium/temurin8-binaries/releases/download/jdk8u512-b09/OpenJDK8U-jdk_x64_linux_hotspot_8u512b09.tar.gz
          printf '%s  %s\n' \
            fb3bfa869012419b562bb4235d0d83ec4f8c1dda62ae432ba20c6c3a7e43f7e4 \
            "${archive}" | sha256sum --check
        displayName: Download and verify Temurin Java 8

    - task: JavaToolInstaller@0
      displayName: Use Java ${{ config.java }}
      inputs:
        versionSpec: '${{ config.java }}'
        jdkArchitectureOption: x64
        ${{ if eq(config.java, '8') }}:
          jdkSourceOption: LocalDirectory
          jdkFile: $(Agent.TempDirectory)/temurin8.tar.gz
          jdkDestinationDirectory: $(Agent.TempDirectory)/temurin8
        ${{ else }}:
          jdkSourceOption: PreInstalled

    - task: DownloadPipelineArtifact@2
      displayName: Download ${{ config.displayName }} build
      inputs:
        buildType: current
        artifactName: build-${{ config.id }}
        targetPath: $(Pipeline.Workspace)/build-${{ config.id }}

    - bash: |
        set -euo pipefail

        mkdir -p "$(Pipeline.Workspace)/connector"
        tar --extract --gzip \
          --file="$(Pipeline.Workspace)/build-${{ config.id }}/build.tar.gz" \
          --directory="$(Pipeline.Workspace)/connector"
        cat "$(Pipeline.Workspace)/build-${{ config.id }}/source-commit.txt"
        test -d "$(Pipeline.Workspace)/connector/connector/target/test-classes"
      displayName: Restore exact source and compiled tests

    - task: Cache@2
      displayName: Restore Maven dependencies
      inputs:
        key: 'maven | "$(Agent.OS)" | "${{ config.id }}" | $(Pipeline.Workspace)/connector/pom.xml | $(Pipeline.Workspace)/connector/connector/pom.xml | $(Pipeline.Workspace)/connector/samples/pom.xml'
        restoreKeys: |
          maven | "$(Agent.OS)" | "${{ config.id }}"
          maven | "$(Agent.OS)"
        path: $(Pipeline.Workspace)/.m2/repository

    - bash: |
        set -euo pipefail

        mvn -B -ntp -pl connector scalatest:test -DskipTests ${{ config.mavenArgs }}
      displayName: Resolve test dependencies without Azure authentication
      workingDirectory: $(Pipeline.Workspace)/connector
      env:
        MAVEN_OPTS: -Dmaven.repo.local=$(Pipeline.Workspace)/.m2/repository

    - task: AzureCLI@2
      displayName: Run precompiled tests with Azure authentication
      inputs:
        azureSubscription: kusto-connectors-arm-sc
        addSpnToEnvironment: true
        scriptType: bash
        scriptLocation: inlineScript
        workingDirectory: $(Pipeline.Workspace)/connector
        inlineScript: |
          set -euo pipefail

          access_token="$(
            az account get-access-token \
              --resource "$(KUSTO_CLUSTER)" \
              --query accessToken \
              --output tsv
          )"
          echo "##vso[task.setsecret]${access_token}"

          export kustoAadAppId="${servicePrincipalId}"
          export kustoAadAuthorityID="${tenantId}"
          export kustoDatabase="$(KUSTO_DATABASE)"
          export kustoCluster="$(KUSTO_CLUSTER)"
          export accessToken="${access_token}"
          export storageAccountUrl="$(STORAGE_CONTAINER_URL)"
          export ingestStorageUrl="$(INGEST_STORAGE_URL)"
          export ingestStorageContainer="$(INGEST_STORAGE_CONTAINER)"

          mvn -o -B -ntp -pl connector scalatest:test ${{ config.mavenArgs }} \
            -DkustoAadAppId="${kustoAadAppId}" \
            -DkustoAadAuthorityID="${kustoAadAuthorityID}" \
            -DkustoDatabase="${kustoDatabase}" \
            -DkustoCluster="${kustoCluster}" \
            -DaccessToken="${accessToken}" \
            -DingestStorageUrl="${ingestStorageUrl}" \
            -DingestStorageContainer="${ingestStorageContainer}"
      env:
        MAVEN_OPTS: -Dmaven.repo.local=$(Pipeline.Workspace)/.m2/repository

    - task: PublishTestResults@2
      displayName: Publish ${{ config.displayName }} test results
      condition: always()
      inputs:
        testResultsFormat: JUnit
        testResultsFiles: connector/target/surefire-reports/*.xml
        searchFolder: $(Pipeline.Workspace)/connector
        testRunTitle: azure-kusto-spark - ${{ config.displayName }}
        failTaskOnFailedTests: true
        failTaskOnMissingResultsFile: true
