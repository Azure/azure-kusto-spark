trigger:
  branches:
    include:
      - '*'

pr:
  branches:
    include:
      - '*'

parameters:
- name: connectorSource
  displayName: Connector source (production branch overrides are for manual trials)
  type: string
  default: self
  values:
  - self
  - master
  - release/spark3

pool:
  vmImage: ubuntu-latest

variables:
- name: javaVersions
  ${{ if or(eq(parameters.connectorSource, 'release/spark3'), and(eq(parameters.connectorSource, 'self'), or(eq(variables['Build.SourceBranch'], 'refs/heads/release/spark3'), eq(variables['System.PullRequest.TargetBranch'], 'refs/heads/release/spark3'), eq(variables['System.PullRequest.TargetBranch'], 'release/spark3')))) }}:
    value: '8,11'
  ${{ else }}:
    value: '17,21'
- name: requiredJavaVersion
  ${{ if contains(variables.javaVersions, '21') }}:
    value: '21'
  ${{ else }}:
    value: '8'

jobs:
- ${{ each javaVersion in split(variables.javaVersions, ',') }}:
  - job: BuildJava${{ javaVersion }}
    displayName: Build - Java ${{ javaVersion }}
    timeoutInMinutes: 40
    continueOnError: ${{ ne(javaVersion, variables.requiredJavaVersion) }}
    steps:
    - checkout: self
      clean: true
      persistCredentials: false

    - ${{ if ne(parameters.connectorSource, 'self') }}:
      - bash: |
          set -euo pipefail

          if [[ "${BUILD_REASON}" != "Manual" ]]; then
            echo "Production source overrides are only allowed for manual trials." >&2
            exit 1
          fi

          git -c credential.helper= fetch --no-tags \
            https://github.com/Azure/azure-kusto-spark.git \
            "refs/heads/${CONNECTOR_SOURCE}"
          git checkout --detach FETCH_HEAD
        displayName: Select production connector source
        env:
          BUILD_REASON: $(Build.Reason)
          CONNECTOR_SOURCE: ${{ parameters.connectorSource }}

    - task: JavaToolInstaller@0
      displayName: Use Java ${{ javaVersion }}
      inputs:
        versionSpec: '${{ javaVersion }}'
        jdkArchitectureOption: x64
        jdkSourceOption: PreInstalled

    - task: Cache@2
      displayName: Cache Maven dependencies
      inputs:
        key: 'maven | "$(Agent.OS)" | "${{ javaVersion }}" | pom.xml | connector/pom.xml | samples/pom.xml'
        restoreKeys: |
          maven | "$(Agent.OS)" | "${{ javaVersion }}"
          maven | "$(Agent.OS)"
        path: $(Pipeline.Workspace)/.m2/repository

    - bash: |
        set -euo pipefail

        mvn clean verify -B -ntp -DskipTests
      displayName: Compile and package without running tests
      env:
        MAVEN_OPTS: -Dmaven.repo.local=$(Pipeline.Workspace)/.m2/repository

    - bash: |
        set -euo pipefail

        git rev-parse HEAD > "$(Build.ArtifactStagingDirectory)/source-commit.txt"
        git archive --format=tar \
          --output="$(Build.ArtifactStagingDirectory)/build.tar" HEAD
        tar --append --file="$(Build.ArtifactStagingDirectory)/build.tar" \
          connector/target samples/target
        gzip "$(Build.ArtifactStagingDirectory)/build.tar"
      displayName: Bundle source and compiled build outputs

    - task: PublishPipelineArtifact@1
      displayName: Publish Java ${{ javaVersion }} build
      inputs:
        targetPath: $(Build.ArtifactStagingDirectory)
        artifact: build-java-${{ javaVersion }}

  - job: TestJava${{ javaVersion }}
    displayName: Test - Java ${{ javaVersion }}
    dependsOn: BuildJava${{ javaVersion }}
    timeoutInMinutes: 40
    continueOnError: ${{ ne(javaVersion, variables.requiredJavaVersion) }}
    condition: and(succeeded(), eq(dependencies.BuildJava${{ javaVersion }}.result, 'Succeeded'), or(ne(variables['Build.Reason'], 'PullRequest'), eq(variables['System.PullRequest.IsFork'], 'False')))
    variables:
    - group: azure-kusto-spark-e2e
    steps:
    - checkout: none

    - task: JavaToolInstaller@0
      displayName: Use Java ${{ javaVersion }}
      inputs:
        versionSpec: '${{ javaVersion }}'
        jdkArchitectureOption: x64
        jdkSourceOption: PreInstalled

    - task: DownloadPipelineArtifact@2
      displayName: Download Java ${{ javaVersion }} build
      inputs:
        buildType: current
        artifactName: build-java-${{ javaVersion }}
        targetPath: $(Pipeline.Workspace)/build-java-${{ javaVersion }}

    - bash: |
        set -euo pipefail

        mkdir -p "$(Pipeline.Workspace)/connector"
        tar --extract --gzip \
          --file="$(Pipeline.Workspace)/build-java-${{ javaVersion }}/build.tar.gz" \
          --directory="$(Pipeline.Workspace)/connector"
        cat "$(Pipeline.Workspace)/build-java-${{ javaVersion }}/source-commit.txt"
        test -d "$(Pipeline.Workspace)/connector/connector/target/test-classes"
      displayName: Restore exact source and compiled tests

    - task: Cache@2
      displayName: Restore Maven dependencies
      inputs:
        key: 'maven | "$(Agent.OS)" | "${{ javaVersion }}" | $(Pipeline.Workspace)/connector/pom.xml | $(Pipeline.Workspace)/connector/connector/pom.xml | $(Pipeline.Workspace)/connector/samples/pom.xml'
        restoreKeys: |
          maven | "$(Agent.OS)" | "${{ javaVersion }}"
          maven | "$(Agent.OS)"
        path: $(Pipeline.Workspace)/.m2/repository

    - bash: |
        set -euo pipefail

        mvn -B -ntp -pl connector scalatest:test -DskipTests
      displayName: Resolve test dependencies without Azure authentication
      workingDirectory: $(Pipeline.Workspace)/connector
      env:
        MAVEN_OPTS: -Dmaven.repo.local=$(Pipeline.Workspace)/.m2/repository

    - task: AzureCLI@2
      displayName: Run precompiled tests with Azure authentication
      inputs:
        azureSubscription: kusto-connectors-arm-sc
        addSpnToEnvironment: true
        scriptType: bash
        scriptLocation: inlineScript
        workingDirectory: $(Pipeline.Workspace)/connector
        inlineScript: |
          set -euo pipefail

          access_token="$(
            az account get-access-token \
              --resource "$(KUSTO_CLUSTER)" \
              --query accessToken \
              --output tsv
          )"
          echo "##vso[task.setsecret]${access_token}"

          export kustoAadAppId="${servicePrincipalId}"
          export kustoAadAuthorityID="${tenantId}"
          export kustoDatabase="$(KUSTO_DATABASE)"
          export kustoCluster="$(KUSTO_CLUSTER)"
          export accessToken="${access_token}"
          export storageAccountUrl="$(STORAGE_CONTAINER_URL)"
          export ingestStorageUrl="$(INGEST_STORAGE_URL)"
          export ingestStorageContainer="$(INGEST_STORAGE_CONTAINER)"

          mvn -o -B -ntp -pl connector scalatest:test \
            -DkustoAadAppId="${kustoAadAppId}" \
            -DkustoAadAuthorityID="${kustoAadAuthorityID}" \
            -DkustoDatabase="${kustoDatabase}" \
            -DkustoCluster="${kustoCluster}" \
            -DaccessToken="${accessToken}" \
            -DingestStorageUrl="${ingestStorageUrl}" \
            -DingestStorageContainer="${ingestStorageContainer}"
      env:
        MAVEN_OPTS: -Dmaven.repo.local=$(Pipeline.Workspace)/.m2/repository

    - task: PublishTestResults@2
      displayName: Publish Java ${{ javaVersion }} test results
      condition: always()
      inputs:
        testResultsFormat: JUnit
        testResultsFiles: connector/target/surefire-reports/*.xml
        searchFolder: $(Pipeline.Workspace)/connector
        testRunTitle: azure-kusto-spark - Java ${{ javaVersion }}
        failTaskOnFailedTests: true
        failTaskOnMissingResultsFile: true
